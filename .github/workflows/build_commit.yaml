name: "Build Commit"
on: push

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3.3.0
            - uses: actions/setup-java@v3.10.0
              with:
                  distribution: temurin
                  java-version: 17

            - name: Prepare release signing
              env:
                  SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
                  KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
              if: env.SIGNING_KEY != ''
              run: |
                  mkdir -p signature
                  echo "$SIGNING_KEY" | base64 -d > signature/kiji-release.jks
                  {
                    echo "storeFile=$GITHUB_WORKSPACE/signature/kiji-release.jks"
                    echo "storePassword=$KEY_STORE_PASSWORD"
                    echo "keyAlias=kiji"
                    echo "keyPassword=$KEY_STORE_PASSWORD"
                  } > signature/keystore_release.properties

            - uses: gradle/gradle-build-action@v2.4.2
            - run: ./gradlew assembleGithubRelease

            - uses: actions/upload-artifact@v4
              with:
                  name: Kiji-GitHub-Build-${{ github.sha }}
                  path: app/build/outputs/apk/github/release/*.apk
